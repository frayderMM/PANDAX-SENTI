server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker puede cambiar la IP de `api` al recrear el contenedor. Resolver
    # el nombre en cada conexión evita que nginx conserve una IP vieja y
    # convierta una API sana en un 502 hasta reiniciar también la web.
    resolver 127.0.0.11 valid=10s;
    set $senti_api http://api:8000;

    # El cliente Android consume el router de eventos con su prefijo público
    # `/api/events`. Esta ubicación debe ir antes de la regla genérica: esa
    # regla quita `/api/` para las rutas del panel y convertiría esta llamada
    # válida en `/events`, que el backend no expone.
    location = /api/events {
        proxy_pass $senti_api/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/events/ {
        proxy_pass $senti_api/api/events/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Con proxy_pass dinámico nginx no elimina automáticamente el prefijo
        # como lo hace con una URL literal; hacerlo explícito conserva el
        # contrato `/api/...` del navegador y `/...` del backend.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $senti_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
}
